# ==============================================================================
# Zentric Marketplace — Nginx Edge Reverse Proxy Configuration (Production & Staging)
# ==============================================================================
# Domain Topology:
#   - Production: https://zentric.me & https://www.zentric.me
#   - Staging:    https://dev.zentric.me
# Upstream Ports:
#   - Frontend (React SPA on Nginx container): 127.0.0.1:5180
#   - Backend (ASP.NET Core 10 Web API):       127.0.0.1:5076
# Security Standards:
#   - Strict TLS 1.2 & TLS 1.3 with Forward Secrecy ciphers
#   - HTTP Strict Transport Security (HSTS) with includeSubDomains and preload
#   - Automated HTTP -> HTTPS 301 Permanent Redirection
#   - Let's Encrypt ACME Challenge webroot routing
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimización de transferencia de datos en kernel
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Límites de tiempo y tamaño de carga útil
    keepalive_timeout 65;
    client_header_timeout 20;
    client_body_timeout 20;
    send_timeout 20;
    client_max_body_size 50M;

    # Ocultar versión del servidor en cabeceras de respuesta
    server_tokens off;

    # Registro de accesos y errores con marcas temporales y tiempos de upstream
    log_format zentric_combined '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log zentric_combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Compresión gzip para tráfico estático y JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Grupos de Upstream (Balanceo Local / Conexiones Persistentes)
    # --------------------------------------------------------------------------
    upstream zentric_frontend_prod {
        server 127.0.0.1:5180 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream zentric_api_prod {
        server 127.0.0.1:5076 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Parámetros Globales SSL / TLS (Mozilla Intermediate Recommendations)
    # --------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Grapado OCSP (OCSP Stapling)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # 1. PRODUCCIÓN: Redirección HTTP -> HTTPS (zentric.me & www.zentric.me)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name zentric.me www.zentric.me;

        # Soporte para renovación automática Let's Encrypt Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirección permanente 301 al dominio canónico seguro HTTPS
        location / {
            return 301 https://zentric.me$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. PRODUCCIÓN: Servidor HTTPS Seguro (https://zentric.me)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name zentric.me www.zentric.me;

        # Certificados TLS / Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/zentric.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zentric.me/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/zentric.me/chain.pem;

        # Redirección de www.zentric.me -> zentric.me (Canónico)
        if ($host = www.zentric.me) {
            return 301 https://zentric.me$request_uri;
        }

        # Cabeceras de Seguridad Estrictas
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Cabeceras estándar para reenvío de proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Soporte para WebSockets y conexiones persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Tiempos de espera de proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Sondeo de salud público directo al backend
        location /health {
            proxy_pass http://zentric_api_prod/health;
            access_log off;
        }

        # Enrutamiento de la API Central (.NET 10 Kestrel en puerto 5076)
        location /api/ {
            proxy_pass http://zentric_api_prod;
        }

        # Interfaz interactiva OpenAPI / Swagger (documentación)
        location /swagger/ {
            proxy_pass http://zentric_api_prod/swagger/;
        }

        # Enrutamiento del Frontend (React SPA en contenedor Nginx puerto 5180)
        location / {
            proxy_pass http://zentric_frontend_prod;
        }

        # Manejo de páginas de error
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # --------------------------------------------------------------------------
    # 3. STAGING: Redirección HTTP -> HTTPS (dev.zentric.me)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name dev.zentric.me;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://dev.zentric.me$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 4. STAGING: Servidor HTTPS Seguro (https://dev.zentric.me)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name dev.zentric.me;

        # Certificados TLS / Let's Encrypt para Staging
        ssl_certificate /etc/letsencrypt/live/dev.zentric.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.zentric.me/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/dev.zentric.me/chain.pem;

        # Cabeceras de Seguridad Estrictas
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Cabeceras proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # Sondeo de salud
        location /health {
            proxy_pass http://zentric_api_prod/health;
            access_log off;
        }

        # Enrutamiento de la API Central
        location /api/ {
            proxy_pass http://zentric_api_prod;
        }

        # Interfaz interactiva OpenAPI / Swagger en desarrollo
        location /swagger/ {
            proxy_pass http://zentric_api_prod/swagger/;
        }

        # Frontend SPA
        location / {
            proxy_pass http://zentric_frontend_prod;
        }
    }
}
