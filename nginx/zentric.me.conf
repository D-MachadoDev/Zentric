# ==============================================================================
# Zentric Marketplace — Virtual Host Configuration (sites-available / conf.d)
# ==============================================================================
# Instalación en servidor anfitrión (Ubuntu / Debian):
#   cp nginx/zentric.me.conf /etc/nginx/sites-available/zentric.me.conf
#   ln -s /etc/nginx/sites-available/zentric.me.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ==============================================================================

# Grupos de Upstream locales hacia los contenedores de Zentric
upstream zentric_frontend {
    server 127.0.0.1:5180 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream zentric_backend_api {
    server 127.0.0.1:5076 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Redirección HTTP -> HTTPS para Producción (zentric.me y www.zentric.me)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zentric.me www.zentric.me;

    # Validación de dominio mediante Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://zentric.me$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Servidor Seguro HTTPS para Producción (https://zentric.me)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zentric.me www.zentric.me;

    # Certificados TLS emitidos por Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/zentric.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zentric.me/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/zentric.me/chain.pem;

    # Protocolos seguros y cifrados modernos
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Canónico: Redirigir www a raíz
    if ($host = www.zentric.me) {
        return 301 https://zentric.me$request_uri;
    }

    # Cabeceras de Seguridad Estrictas
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Cabeceras de Proxy Compartidas
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
    client_max_body_size 50M;

    # Endpoint de Salud (acceso sin registro de logs para sondas continuas)
    location /health {
        proxy_pass http://zentric_backend_api/health;
        access_log off;
    }

    # Proxy para API Central de Zentric (.NET 10)
    location /api/ {
        proxy_pass http://zentric_backend_api;
    }

    # Documentación OpenAPI / Swagger
    location /swagger/ {
        proxy_pass http://zentric_backend_api/swagger/;
    }

    # Proxy para Frontend (React SPA en Vite / Nginx)
    location / {
        proxy_pass http://zentric_frontend;
    }
}

# ------------------------------------------------------------------------------
# 3. Redirección HTTP -> HTTPS para Staging (dev.zentric.me)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dev.zentric.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://dev.zentric.me$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 4. Servidor Seguro HTTPS para Staging (https://dev.zentric.me)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.zentric.me;

    ssl_certificate /etc/letsencrypt/live/dev.zentric.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.zentric.me/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dev.zentric.me/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    client_max_body_size 50M;

    location /health {
        proxy_pass http://zentric_backend_api/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://zentric_backend_api;
    }

    location /swagger/ {
        proxy_pass http://zentric_backend_api/swagger/;
    }

    location / {
        proxy_pass http://zentric_frontend;
    }
}
