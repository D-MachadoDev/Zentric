# ==============================================================================
# Zentric Marketplace — Docker Compose de Producción (W6-S02)
# ==============================================================================
# Reglas operativas:
# 1. Prohibidos valores por defecto inseguros para secretos críticos (POSTGRES_PASSWORD,
#    JWT_SIGNING_KEY, CORS_ALLOWED_ORIGINS). Si faltan en .env, compose aborta antes de arrancar.
# 2. PostgreSQL 16.15-alpine aislado en red interna `zentric-internal` sin exponer 5432 al host.
# 3. En Producción, Program.cs no ejecuta MigrateAsync() automáticamente al arrancar la API;
#    las migraciones se ejecutan de forma controlada mediante el servicio `migrator` (profile: migrate).
# Uso:
#   cp .env.example .env  # Completar secretos reales
#   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrator
#   docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  db:
    image: postgres:16.15-alpine
    container_name: zentric-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-ZentricDb}
    volumes:
      - zentric_pgdata_prod:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ZentricDb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - zentric-internal

  migrator:
    image: zentric-api:prod
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-ZentricDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      Jwt__Issuer: ${Jwt__Issuer:-zentric-api}
      Jwt__Audience: ${Jwt__Audience:-zentric-client}
      Jwt__SigningKey: ${Jwt__SigningKey:?Defina Jwt__SigningKey de al menos 256 bits en .env}
      Bootstrap__AdministratorEmail: ${BOOTSTRAP_ADMIN_EMAIL:?Defina BOOTSTRAP_ADMIN_EMAIL en .env}
      Bootstrap__AdministratorPassword: ${BOOTSTRAP_ADMIN_PASSWORD:?Defina BOOTSTRAP_ADMIN_PASSWORD en .env}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:?Defina Cors__AllowedOrigins explicito sin comodin en .env}
    networks:
      - zentric-internal

  api:
    image: zentric-api:prod
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zentric-api-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-ZentricDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      Jwt__Issuer: ${Jwt__Issuer:-zentric-api}
      Jwt__Audience: ${Jwt__Audience:-zentric-client}
      Jwt__SigningKey: ${Jwt__SigningKey:?Defina Jwt__SigningKey de al menos 256 bits en .env}
      Bootstrap__AdministratorEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdministratorPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:?Defina Cors__AllowedOrigins explicito sin comodin en .env}
      Payments__Provider: ${PAYMENTS_PROVIDER:-simulated}
      Payments__ApiKey: ${PAYMENTS_API_KEY:-}
      Payments__WebhookSecret: ${PAYMENTS_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - zentric-internal
      - zentric-edge

  frontend:
    image: zentric-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zentric-frontend-prod
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      ZENTRIC_API_BASE_URL: ${ZENTRIC_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - zentric-edge

networks:
  zentric-internal:
    driver: bridge
    internal: true
  zentric-edge:
    driver: bridge

volumes:
  zentric_pgdata_prod:
