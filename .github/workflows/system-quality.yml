name: system-quality

# These checks need the full application stack, not only the frontend bundle.
# Playwright drives the browser; Lighthouse measures the production preview.

on:
    push:
        paths:
            - "frontend/**"
            - "backend/**"
            - "docker-compose.yml"
            - ".github/workflows/system-quality.yml"
    pull_request:
        paths:
            - "frontend/**"
            - "backend/**"
            - "docker-compose.yml"
            - ".github/workflows/system-quality.yml"

concurrency:
    group: system-quality-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        name: End-to-end browser tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16.15-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: ci-postgres-password-32-chars
                    POSTGRES_DB: ZentricDb
                ports:
                    - 15432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d ZentricDb"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 12.6.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Install frontend dependencies
              working-directory: frontend
              run: pnpm install --frozen-lockfile

            # Playwright's webServer config launches the API and Vite server.
            # These values are test-only and are inherited by both processes.
            - name: Run browser tests
              working-directory: frontend
              env:
                  E2E_API_BASE_URL: http://localhost:15433
                  ConnectionStrings__DefaultConnection: Host=localhost;Port=15432;Database=ZentricDb;Username=postgres;Password=ci-postgres-password-32-chars
                  ASPNETCORE_ENVIRONMENT: Development
                  Jwt__Issuer: zentric-api
                  Jwt__Audience: zentric-client
                  Jwt__SigningKey: ci-only-signing-key-base64-abcdefghijklmnopqrstuvwxyz0123456789
                  Bootstrap__AdministratorEmail: admin@zentric.test
                  Bootstrap__AdministratorPassword: ci-only-admin-password
                  Cors__AllowedOrigins: http://localhost:15434
              run: pnpm exec playwright install --with-deps chromium firefox webkit && pnpm exec playwright test --reporter=html,line

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      frontend/playwright-report
                      frontend/test-results
                  retention-days: 7

    lighthouse:
        name: Lighthouse
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 12.6.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install frontend dependencies
              working-directory: frontend
              run: pnpm install --frozen-lockfile

            - name: Build production bundle
              working-directory: frontend
              run: pnpm build

            - name: Run Lighthouse
              working-directory: frontend
              run: pnpm exec lhci autorun

            - name: Upload Lighthouse report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: lighthouse-report
                  path: frontend/.lighthouseci
                  retention-days: 7
