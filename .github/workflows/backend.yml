name: backend
on:
  push:
    paths: ["backend/**", "orchestrator-state.json", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**"]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore backend/Zentric.slnx
      - run: dotnet build backend/Zentric.slnx -warnaserror --no-restore
      - run: dotnet test backend/Zentric.slnx --filter "FullyQualifiedName!~E2E" --no-build --collect:"XPlat Code Coverage"
