name: backend
on:
  push:
    paths: ["backend/**", "orchestrator-state.json", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**"]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore backend/Zentric.slnx
      - name: Build with zero warnings
        run: dotnet build backend/Zentric.slnx -warnaserror --no-restore -nodeReuse:false
      - name: Run unit, integration and security tests with >=90% Coverlet gate
        run: dotnet test backend/Zentric.slnx --filter "FullyQualifiedName!~E2E" --no-build --settings backend/Coverlet.runsettings --collect:"XPlat Code Coverage"
      - name: Build production Docker image
        run: docker build -f backend/Dockerfile -t zentric-api:ci .
