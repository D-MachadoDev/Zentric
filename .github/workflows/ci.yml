name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Backend (.NET 10 + Coverlet >=90%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore Zentric.slnx
    - name: Build
      # Advertencia: se convierte en error. El objetivo de la rama es 0 warnings.
      run: dotnet build Zentric.slnx --no-restore -warnaserror -nodeReuse:false
    - name: Test & Coverage Gate (>=90%)
      timeout-minutes: 10
      run: >-
        dotnet test Zentric.slnx --no-build --verbosity normal
        --settings Coverlet.runsettings --collect:"XPlat Code Coverage"
        --blame-hang-timeout 5m --blame-hang-dump-type none
    - name: Apagar servidores de compilacion
      if: always()
      run: dotnet build-server shutdown

  frontend:
    name: Frontend (pnpm + turbo + Vitest >=90%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.6.5
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Verificar que existe el lockfile
      run: test -f pnpm-lock.yaml || (echo "::error::falta frontend/pnpm-lock.yaml" && exit 1)
    - name: Instalar dependencias con lockfile congelado
      run: pnpm install --frozen-lockfile
    - name: Typecheck
      run: pnpm typecheck
    - name: Build
      run: pnpm build
    - name: Test & Coverage (@zentric/ui >=90%)
      working-directory: frontend/packages/ui
      run: pnpm exec vitest run --coverage
    - name: Test & Coverage (@zentric/frontend >=90%)
      working-directory: frontend/apps/frontend
      run: pnpm exec vitest run --coverage
