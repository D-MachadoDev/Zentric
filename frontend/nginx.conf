server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API de Zentric. En el despliegue de Docker el host es el nombre del
    # servicio; en desarrollo se usa el host local. Ver
    # frontendSDD/Frontend-Adapters.md seccion 1.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass         http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Recursos versionados: cache largo
    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Configuracion de entorno: nunca se cachea
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Aplicacion de una sola pagina
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}